# Order Processor Service - Local Configuration (without Dapr)
# Usage: Set SPRING_PROFILES_ACTIVE=local

server:
  port: ${PORT:8007}

# Platform Mode
platform:
  mode: direct

# Messaging - Direct RabbitMQ connection
messaging:
  provider: rabbitmq

# RabbitMQ Configuration
rabbitmq:
  host: localhost
  port: 5672
  username: admin
  password: admin123
  virtual-host: /
  exchange: order-processor-events
  queue: order-processor-queue

# Database - Direct connection (no Dapr secrets)
spring:
  datasource:
    url: jdbc:postgresql://localhost:5435/order_processor_db
    username: postgres
    password: postgres

logging:
  level:
    com.xshopai.orderprocessor: DEBUG
