# Order Processor Service - Database Only
# For local development: run only PostgreSQL, run app locally with Dapr
#
# Usage:
#   docker-compose -f docker-compose.db.yml up -d
#
# Port: 5435 (mapped to internal 5432)
# Database: order_processor_db
# User: postgres
# Password: postgres

version: "3.8"

services:
  order-processor-postgres:
    image: postgres:16
    container_name: order-processor-postgres
    restart: unless-stopped
    ports:
      - "5435:5432"
    environment:
      POSTGRES_DB: order_processor_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - order_processor_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d order_processor_db"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  order_processor_postgres_data:
    name: order_processor_postgres_data
